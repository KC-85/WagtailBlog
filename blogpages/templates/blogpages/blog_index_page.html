{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
    
    <h1>{{ page.title }}</h1>
    <h2>{{ page.subtitle }}</h2>

    <h3>Body is below</h3>
    {{ page.body|richtext }}

    <hr>
    <hr>
    <hr>

    <h4>Blog Posts are below</h4>
    {% for blog_post in blogpages %}
        <a href="{{ blog_post.url }}">
            {{ blog_post.title }}
        </a>
        <p>{{ blog_post.subtitle }}</p>
        <hr>
    {% endfor %}

{% endblock %}
