{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
    <style>
        .richtext {
            max-width: 50%;
            border: 1px solid black;
        }
        .richtext .richtext-image.thumbnail-150 {
            border: 10px solid blue;
        }
    </style>
    
    <h1>{{ page.title }}</h1>
    <h2>{{ page.subtitle }}</h2>

    <h3>Body is below</h3>

    <div class="richtext">
        {{ page.body|richtext }}
    </div>

    <h4>Tags</h4>
    {% for tag in page.tags.all %}
        {{ tag.name }} <a href="/blog/?tag={{ tag.slug }}">{{ tag.slug }}</a>
    {% endfor %}

{% endblock %}
