{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
    <style>
        .richtext {
            max-width: 50%;
            border: 1px solid black;
        }
        .richtext .richtext-image.thumbnail-150 {
            border: 10px solid blue;
        }
    </style>
    
    <h1>{{ page.title }}</h1>
    <h2>{{ page.subtitle }}</h2>

    <h4>Body is below</h4>

    <div class="richtext">
        {{ page.body|richtext }}
    </div>

{% endblock %}
